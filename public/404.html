<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Halaman Tidak Ditemukan</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      background: radial-gradient(circle at 50% 30%, #152238 0%, #0b0f19 80%);
      padding: 20px;
    }
    .error-card {
      max-width: 450px;
      padding: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div style="font-size:64px; margin-bottom:16px;">🔍</div>
    <h1 style="font-size:32px; font-weight:800; margin-bottom:10px;">404</h1>
    <h2 style="font-size:18px; margin-bottom:12px; color:var(--text-muted);">Halaman Tidak Ditemukan</h2>
    <p style="font-size:14px; color:var(--text-dim); margin-bottom:24px;">Halaman atau tautan percakapan yang Anda tuju tidak tersedia atau telah dipindahkan.</p>
    <a href="/" class="btn-primary">Kembali ke Beranda</a>
  </div>
</body>
</html>
