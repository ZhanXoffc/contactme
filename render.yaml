services:
  - type: web
    name: zhanchat
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_NAME
        value: Owner ZhanChat
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: OWNER_PHONE
        value: "+6281234567890"
      - key: MAX_FILE_SIZE_MB
        value: "50"
